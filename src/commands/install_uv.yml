description: >
  Installs uv, Astral's Python package manager, for Linux on amd64 or arm64,
  picked from the machine's CPU architecture, after verifying its SHA-512
  checksum. The tool install commands install pip-audit, Bandit and
  pip-licenses with it, and run it first unless told it already ran. The
  static musl build runs on any Linux, glibc or musl.
parameters:
  caching:
    type: boolean
    default: true
    description: >
      Cache the downloaded release between jobs, keyed by version, CPU
      architecture and home directory. Only verified releases are cached, and
      a cached release is verified again before it is installed.
  download_base_url:
    type: string
    default: ""
    description: >
      Base URL of an internal mirror of GitHub releases, such as an
      Artifactory or Nexus remote repository, to download from instead of
      https://github.com (and Astral's own copy at releases.astral.sh). It
      replaces https://github.com in the release URL, so the mirror must
      serve the same path. It must be an https:// URL, without credentials
      (user:password@) or a query or fragment, which would show in the log.
      What is downloaded is still verified against this orb's checksum
      table. Environment variables are expanded.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of the directory to install uv into. It is created if
      needed and added to the PATH of later steps when it isn't already on it,
      and must be writable without root. Environment variables are expanded.
      Defaults to $HOME/.python-security-orb/bin. The tool install commands
      look for uv there and put their tools there too. Executor images don't
      put that directory on the PATH, so it goes first, ahead of a uv an
      image ships.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 verification against this orb's checksum table. "strict"
      (default) fails before downloading anything when the version has no
      checksum in the table. "known_versions" verifies listed versions and
      installs unlisted versions unverified, with a warning. "false" skips
      verification and is not recommended.
  version:
    type: string
    default: "0.13.6"
    description: >
      Version of uv to install, such as 0.13.6. A leading "v" is ignored,
      and environment variables are expanded. The uv release also fixes the
      patch release of the Python the tool install commands download, and
      the hash it is checked against.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The key is computed from a file that names the CPU (uname -m, as
        # {{ arch }} also encodes the CPU model and would split the cache by
        # host), HOME (a cache is restored to the absolute path it was saved
        # from), and the version with environment variables expanded.
        - run:
            name: Prepare uv cache key
            environment:
              ORB_CACHE_KEY_FILE: /tmp/python-security-orb-uv-cache-key
              PARAM_VERSION: << parameters.version >>
            command: << include(scripts/cache_key.sh) >>
        # A saved cache can't be replaced. Bump v1 when an existing checksum
        # table entry changes, so caches saved for the old bytes stop being
        # restored.
        - restore_cache:
            key: python-security-orb-uv-v1-<< parameters.version >>-{{ checksum "/tmp/python-security-orb-uv-cache-key" }}
  - run:
      name: Install uv << parameters.version >>
      environment:
        PARAM_CACHING: << parameters.caching >>
        PARAM_DOWNLOAD_BASE_URL: << parameters.download_base_url >>
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(install/uv/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: python-security-orb-uv-v1-<< parameters.version >>-{{ checksum "/tmp/python-security-orb-uv-cache-key" }}
            paths:
              - ~/.cache/python-security-orb-uv
