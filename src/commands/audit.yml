description: >
  Audits a project's locked dependencies for known vulnerabilities with
  pip-audit, PyPA's scanner, which asks PyPI's (or OSV's) advisory database
  about each package and version. It reads the lockfiles (uv.lock,
  poetry.lock, pdm.lock, Pipfile.lock, pylock.toml), pinned requirements
  files or installed environments named, or every lockfile in working_dir,
  and audits every pinned version in them, whatever its markers, without
  resolving anything or running build code. Writes JSON, SARIF and JUnit
  reports. Vulnerabilities not in ignore fail the step unless report_only is
  true; an audit that didn't complete, a package that couldn't be audited, or
  an audit of nothing fails it either way. Run install (tools: pip-audit)
  first.
parameters:
  working_dir:
    type: string
    default: "."
    description: The directory to run in. lockfiles, requirements and environment are relative to it.
  lockfiles:
    type: string
    default: ""
    description: >
      Lockfiles to audit, separated by commas or spaces, as paths or globs:
      uv.lock, poetry.lock (1.x and 2.x), pdm.lock (4.x), Pipfile.lock and
      PEP 751 pylock.toml files. Leave lockfiles, requirements and environment
      empty to audit every lockfile in working_dir. A path or glob that
      matches no file fails the step. Environment variables are expanded.
  requirements:
    type: string
    default: ""
    description: >
      Requirements files to audit, separated by commas or spaces, as paths or
      globs, such as uv pip compile or pip-compile output. Every requirement
      must be pinned with ==, since only a pinned version can be audited
      without resolving; -r includes are followed. Environment variables are
      expanded.
  environment:
    type: string
    default: ""
    description: >
      An installed environment to audit, as its Python interpreter, such as
      .venv/bin/python, or its directory, such as .venv: every distribution
      the interpreter sees, which it lists itself, so the environment needs
      no pip. Environment variables are expanded.
  service:
    type: enum
    enum: ["pypi", "osv"]
    default: pypi
    description: >
      The vulnerability service pip-audit asks: pypi (PyPI's JSON API, which
      reports a package it doesn't know, such as a private one, as one it
      couldn't audit) or osv (api.osv.dev, or osv_url, which returns nothing
      for a package it doesn't know, so it passes unaudited).
  osv_url:
    type: string
    default: ""
    description: >
      With service osv, the URL of a self-hosted OSV API to ask instead of
      https://api.osv.dev/v1/query: an https:// URL without credentials, a
      query or a fragment. Environment variables are expanded.
  timeout:
    type: integer
    default: 15
    description: Seconds pip-audit waits for each request to the vulnerability service.
  ignore:
    type: string
    default: ""
    description: >
      Vulnerability IDs to ignore, separated by commas or spaces, such as
      PYSEC-2018-28 or GHSA-x84v-xcm2-53pg. An ID matches a vulnerability's
      own ID or any alias, so a CVE ID works too. Ignored vulnerabilities are
      listed in the reports. Environment variables are expanded.
  unused_ignores:
    type: enum
    enum: ["allow", "warn", "deny"]
    default: warn
    description: >
      What to do about an ignore entry that matched no vulnerability, such as
      one for a package since upgraded: allow, warn, or deny, which fails the
      step like a finding.
  allow_skipped:
    type: string
    default: ""
    description: >
      Packages that may go unaudited, separated by commas or spaces, such as
      private packages no public advisory database knows, or a git
      dependency. Any other package that couldn't be audited fails the step.
      Local packages, such as the project itself, are never audited and need
      no entry. Environment variables are expanded.
  allow_empty:
    type: boolean
    default: false
    description: >
      Let an audit pass that found no package to audit. By default it fails,
      since it checked nothing.
  extra_args:
    type: string
    default: ""
    description: >
      Further arguments for pip-audit, such as --cache-dir /tmp/pip-audit.
      They are split like shell words, but nothing in them is expanded or
      run. Options that decide what is audited or how the report is written
      are refused. Environment variables are expanded.
  output_dir:
    type: string
    default: /tmp/python-security-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  report_name:
    type: string
    default: pip-audit
    description: >
      The reports' file name without its extension: <report_name>.json (the
      orb's summary), <report_name>.pip-audit.json (pip-audit's own report)
      and <report_name>.sarif. Letters, digits, '.', '_' and '-'.
  junit:
    type: boolean
    default: true
    description: >
      Write the audit as JUnit (output_dir/junit/<report_name>.xml), one case
      per package, and store it with store_test_results for CircleCI's Tests
      tab.
  run_record:
    type: boolean
    default: false
    description: >
      Also write a run record (<report_name>.run-record.json): what was
      audited, from which inputs with their SHA-256, with which pip-audit,
      and what it found.
  report_only:
    type: boolean
    default: false
    description: >
      Report vulnerabilities without failing the step, to adopt the check
      gradually. An audit that didn't complete, a package that couldn't be
      audited, or an audit of nothing still fails it.
  store_artifacts:
    type: boolean
    default: true
    description: Store output_dir as job artifacts under python-security-reports/, including when the step fails.
steps:
  - run:
      name: pip-audit (<< parameters.report_name >>)
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_ALLOW_EMPTY: << parameters.allow_empty >>
        PARAM_ALLOW_SKIPPED: << parameters.allow_skipped >>
        PARAM_ENVIRONMENT: << parameters.environment >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_IGNORE: << parameters.ignore >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_LOCKFILES: << parameters.lockfiles >>
        PARAM_OSV_URL: << parameters.osv_url >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_REQUIREMENTS: << parameters.requirements >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        PARAM_SERVICE: << parameters.service >>
        PARAM_TIMEOUT: << parameters.timeout >>
        PARAM_UNUSED_IGNORES: << parameters.unused_ignores >>
        SCRIPT_PYTHON_SECURITY_LIB: << include(scripts/lib/python_security.sh) >>
        SCRIPT_PYTHON_SECURITY_PY: << include(scripts/lib/python_security.py) >>
      command: << include(scripts/audit.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: python-security-reports
            when: always
